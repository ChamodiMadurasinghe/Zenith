name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  USE_FAKE_AI: "true"
  APP_PASSWORD: ci-test
  FLASK_SECRET_KEY: ci-secret-not-for-production
  FLASK_ENV: testing
  HOST: 127.0.0.1
  PYTHONUTF8: "1"

jobs:
  conflicts:
    name: Merge + conflict markers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Fail if leftover conflict markers
        run: |
          set -euo pipefail
          if git grep -nE '^(<<<<<<<|>>>>>>>)' -- . \
            ':!.github/workflows/**'; then
            echo "::error::Conflict markers committed. Resolve the merge and remove leftover marker lines."
            exit 1
          fi

      - name: Fail if PR cannot merge into base
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}"
          git config user.email "ci@zenith.local"
          git config user.name "zenith-ci"
          git merge --no-commit --no-ff "origin/${{ github.base_ref }}"

  test:
    name: Python tests + schema + health
    runs-on: ubuntu-latest
    needs: [conflicts]
    env:
      DATABASE_PATH: ${{ runner.temp }}/invoice_cheque.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Syntax
        run: >
          python -m compileall -q
          app.py config.py backup_engine.py whatsapp_agent.py
          agents core routes db agentic scripts

      - name: Unit tests
        run: python -m pytest agentic/tests core/tests agents/tests routes/tests -q --tb=short

      - name: Schema + seed apply
        run: python scripts/init_db.py

      - name: App import + /health
        run: |
          python - <<'PY'
          from app import create_app
          app = create_app()
          client = app.test_client()
          response = client.get("/health")
          assert response.status_code == 200, response.status_code
          payload = response.get_json()
          assert payload and payload.get("ok") is True, payload
          print("health_ok", payload)
          PY

      - name: pip-audit (advisory until triaged)
        continue-on-error: true
        run: pip-audit -r requirements.txt

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    needs: [conflicts]
    steps:
      - uses: actions/checkout@v4
      - name: Scan working tree for secrets
        run: >
          docker run --rm -v "$PWD:/src:ro"
          ghcr.io/gitleaks/gitleaks:latest
          detect --source /src --no-git --verbose

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [conflicts]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t zenith:ci .

  bridge-syntax:
    name: WhatsApp bridge JS syntax
    runs-on: ubuntu-latest
    needs: [conflicts]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: node --check
        working-directory: whatsapp-bridge
        run: |
          node --check src/index.js
          node --check src/loadEnv.js
          node --check src/ingestHandler.js
          node --check src/mediaDownload.js
          node --check src/sendHandler.js
          node --check src/sessionGuard.js
          node --check scripts/check-node.js
