<div class="table-scroll items-table-wrap">
  <table class="data-table" id="items-table">
    <thead>
      <tr>
        <th>{{ t('col_code') }}</th>
        <th>{{ t('col_name') }}</th>
        <th>{{ t('col_qty') }}</th>
        <th>{{ t('col_mrp') }}</th>
        <th>{{ t('col_single_price') }}</th>
        <th>{{ t('col_discount') }}</th>
        <th>{{ t('col_line_total') }}</th>
      </tr>
    </thead>
    <tbody>
      {% for item in line_items %}
      <tr>
        <td><input name="item_code" value="{{ item.item_code or '' }}"></td>
        <td><input name="item_name" value="{{ item.item_name or '' }}"></td>
        <td><input type="number" name="item_qty" value="{{ item.item_qty or 1 }}"></td>
        <td><input type="number" step="0.01" name="item_mrp" value="{{ item.item_mrp or 0 }}"></td>
        <td><input type="number" step="0.01" name="item_price" value="{{ item.item_price or 0 }}"></td>
        <td><input type="number" step="0.01" name="item_discount" value="{{ item.item_discount or 0 }}"></td>
        <td><input type="number" step="0.01" name="item_line_total" value="{{ item.item_line_total or 0 }}"></td>
      </tr>
      {% endfor %}
      <tr class="item-template">
        <td><input name="item_code" placeholder="SKU"></td>
        <td><input name="item_name" placeholder="Item"></td>
        <td><input type="number" name="item_qty" value="1"></td>
        <td><input type="number" step="0.01" name="item_mrp" value="0"></td>
        <td><input type="number" step="0.01" name="item_price" value="0"></td>
        <td><input type="number" step="0.01" name="item_discount" value="0"></td>
        <td><input type="number" step="0.01" name="item_line_total" value="0"></td>
      </tr>
    </tbody>
  </table>
</div>
